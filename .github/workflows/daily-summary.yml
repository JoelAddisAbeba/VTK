name: Vatican Watch Tagesstatus

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  summary:
    runs-on: ubuntu-latest

    steps:
      - name: Workflow-Läufe auswerten und Nachricht senden
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || vars.NTFY_TOPIC }}

        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone

          token = os.environ["GH_TOKEN"]
          repository = os.environ["REPOSITORY"]
          ntfy_topic = os.environ["NTFY_TOPIC"].strip()

          now = datetime.now(timezone.utc)
          since = now - timedelta(hours=24)
          since_text = since.strftime("%Y-%m-%dT%H:%M:%SZ")

          all_runs = []
          page = 1

          while True:
              query = urllib.parse.urlencode({
                  "per_page": 100,
                  "page": page,
                  "created": f">={since_text}",
              })

              url = (
                  f"https://api.github.com/repos/{repository}"
                  f"/actions/workflows/watch.yml/runs?{query}"
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2026-03-10",
                  },
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  runs = json.load(response)["workflow_runs"]

              all_runs.extend(runs)

              if len(runs) < 100:
                  break

              page += 1

          total = len(all_runs)
          successful = sum(
              run.get("conclusion") == "success"
              for run in all_runs
          )
          running = sum(
              run.get("status") != "completed"
              for run in all_runs
          )
          unsuccessful = total - successful - running
          success_rate = (successful / total * 100) if total else 0

          message = (
              "Vatican Watch – letzte 24 Stunden\n\n"
              f"Versuche: {total}\n"
              f"Erfolgreich: {successful}\n"
              f"Nicht erfolgreich: {unsuccessful}\n"
              f"Noch aktiv: {running}\n"
              f"Erfolgsquote: {success_rate:.1f} %\n\n"
              "Sollwert bei 5-Minuten-Takt: ca. 288 Versuche"
          )

          if ntfy_topic.startswith(("https://", "http://")):
              ntfy_url = ntfy_topic
          else:
              ntfy_url = (
                  "https://ntfy.sh/"
                  + urllib.parse.quote(ntfy_topic, safe="")
              )

          notification = urllib.request.Request(
              ntfy_url,
              data=message.encode("utf-8"),
              method="POST",
              headers={
                  "Title": "Vatican Watch Tagesstatus",
                  "Priority": "default",
                  "Tags": "bar_chart,white_check_mark",
              },
          )

          with urllib.request.urlopen(notification, timeout=30):
              pass
          PY
