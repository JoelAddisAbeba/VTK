name: vatican-watch

on:
  workflow_dispatch:
    inputs:
      test:
        description: "Testnachricht senden"
        required: false
        default: false
        type: boolean

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install playwright requests && playwright install --with-deps chromium

      - run: python watcher.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || vars.NTFY_TOPIC }}
          TEST: ${{ inputs.test && '1' || '0' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug
          path: debug/
          retention-days: 2
